# Tudo (painel + API + banco):  docker compose up --build  →  painel em http://localhost:5173, API em http://localhost:8000/docs
# Só o banco (API rodando fora do Docker, para desenvolver): docker compose up -d postgres
services:
  postgres:
    image: postgres:16-alpine
    container_name: stockflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Cria o banco de testes na primeira inicialização
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    container_name: stockflow-api
    restart: unless-stopped
    env_file: .env
    environment:
      # Dentro da rede do compose o banco se chama "postgres", não localhost
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build: ./frontend
    container_name: stockflow-web
    restart: unless-stopped
    ports:
      # Mesma porta do Vite no desenvolvimento
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
