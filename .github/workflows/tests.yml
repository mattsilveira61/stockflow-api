name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    name: API (lint + pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stockflow
          POSTGRES_PASSWORD: stockflow
          POSTGRES_DB: stockflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stockflow"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://stockflow:stockflow@localhost:5432/stockflow_test
      TEST_DATABASE_URL: postgresql+psycopg://stockflow:stockflow@localhost:5432/stockflow_test
      API_KEY: chave-de-teste-do-ci-1234567890
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: pytest

  web:
    name: Painel (tipos, lint, build, e2e)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stockflow
          POSTGRES_PASSWORD: stockflow
          POSTGRES_DB: stockflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stockflow"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://stockflow:stockflow@localhost:5432/stockflow
      API_KEY: chave-de-teste-do-ci-1234567890
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Sobe a API com os dados de demonstração
        working-directory: .
        run: |
          pip install -r requirements.txt
          alembic upgrade head
          python -m app.seed
          uvicorn app.main:app --port 8000 > api.log 2>&1 &
          for i in $(seq 30); do curl -sf localhost:8000/health && break; sleep 1; done

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test

      - name: Log da API (se falhar)
        if: failure()
        working-directory: .
        run: cat api.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/test-results
          retention-days: 7
